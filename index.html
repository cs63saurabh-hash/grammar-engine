<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pāṇini Grammar Parsing Engine — 2407042</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#161009; --ink-2:#1f1710; --leaf:#e9dfc4; --gold:#c99a3b;
    --gold-dim:#8a6c2c; --line:#3a2f21; --text:#efe6d2; --text-dim:#a99b7c;
    --karta:#c99a3b; --karma:#b04a34; --karana:#4f7f8f; --sampradana:#6f9457;
    --apadana:#a3763f; --sambandha:#8b6bb0; --adhikarana:#4a6fa5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--ink); color:var(--text);
    font-family:'IBM Plex Sans',sans-serif; display:flex; align-items:center;
    justify-content:center; padding:40px 20px;
  }
  .wrap{max-width:640px; width:100%;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.08em;
    color:var(--gold); text-transform:uppercase; margin:0 0 10px;
  }
  h1{
    font-family:'Spectral',serif; font-weight:600; font-size:30px;
    margin:0 0 28px; color:var(--leaf);
  }
  .parser{
    border:1px solid var(--line); border-radius:6px; background:var(--ink-2); padding:22px;
  }
  input[type=text]{
    width:100%; background:var(--ink); border:1px solid var(--line); color:var(--leaf);
    font-family:'IBM Plex Mono',monospace; font-size:16px; padding:13px 14px;
    border-radius:4px; outline:none;
  }
  input[type=text]:focus{border-color:var(--gold);}
  .chip-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;}
  .chip{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text-dim);
    border:1px solid var(--line); background:transparent; padding:6px 12px;
    border-radius:100px; cursor:pointer;
  }
  .chip:hover{border-color:var(--gold); color:var(--gold);}
  .result-area{margin-top:20px;}
  .word-card{
    display:grid; grid-template-columns:120px 1fr auto; gap:14px; align-items:center;
    padding:12px 16px; border:1px solid var(--line); border-radius:4px;
    margin-bottom:8px; background:var(--ink);
  }
  .word-card .word{font-family:'IBM Plex Mono',monospace; font-size:15px; color:var(--leaf);}
  .word-card .stem-suffix{font-size:13px; color:var(--text-dim);}
  .word-card .stem-suffix b{color:var(--text); font-weight:500;}
  .word-card.unrecognized{opacity:0.55;}
  @media (max-width:520px){ .word-card{grid-template-columns:1fr;} }
  .role-pill{
    font-family:'IBM Plex Mono',monospace; font-size:12px; padding:5px 11px;
    border-radius:100px; white-space:nowrap;
  }
  .role-karta{background:rgba(201,154,59,0.16); color:var(--karta);}
  .role-karma{background:rgba(176,74,52,0.16); color:var(--karma);}
  .role-karana{background:rgba(79,127,143,0.18); color:var(--karana);}
  .role-sampradana{background:rgba(111,148,87,0.18); color:var(--sampradana);}
  .role-apadana{background:rgba(163,118,63,0.18); color:var(--apadana);}
  .role-sambandha{background:rgba(139,107,176,0.18); color:var(--sambandha);}
  .role-adhikarana{background:rgba(74,111,165,0.18); color:var(--adhikarana);}
  .role-none{background:rgba(169,155,124,0.12); color:var(--text-dim);}
  .summary-line{
    font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--text-dim);
    margin-top:14px; padding-top:14px; border-top:1px dashed var(--line);
  }
  .summary-line span{color:var(--leaf);}
</style>
</head>
<body>

<div class="wrap">
  <p class="eyebrow">Roll No. 2407042 &middot; Pāṇini Grammar Parsing Engine</p>
  <h1>Type a Sanskrit word or sentence</h1>

  <div class="parser">
    <input type="text" id="sentence-input" value="ramah phalam khadati" autocomplete="off" spellcheck="false" />
    <div class="chip-row" id="samples"></div>
    <div class="result-area" id="results"></div>
  </div>
</div>

<script>
const RULES = [
  {suffix:"asya", vibhakti:"Ṣaṣṭhī (6th)",   karaka:"sambandha (possessor)",  role:"sambandha",  priority:10},
  {suffix:"ena",  vibhakti:"Tṛtīyā (3rd)",   karaka:"karana (instrument)",    role:"karana",     priority:10},
  {suffix:"aya",  vibhakti:"Caturthī (4th)", karaka:"sampradana (recipient)", role:"sampradana", priority:10},
  {suffix:"at",   vibhakti:"Pañcamī (5th)",  karaka:"apadana (source)",       role:"apadana",    priority:9},
  {suffix:"am",   vibhakti:"Dvitīyā (2nd)",  karaka:"karma (object)",         role:"karma",      priority:8},
  {suffix:"ah",   vibhakti:"Prathamā (1st)", karaka:"karta (subject)",        role:"karta",      priority:8},
  {suffix:"e",    vibhakti:"Saptamī (7th)",  karaka:"adhikarana (location)",  role:"adhikarana", priority:5},
];

const KNOWN_STEMS = {
  ram:"Rama (proper noun)", krishn:"Krishna (proper noun)", balak:"child",
  vriksh:"tree", phal:"fruit", gur:"teacher", shishy:"student",
  gram:"village", nad:"river", pustak:"book"
};

const SORTED_RULES = [...RULES].sort((a,b)=> (b.priority-a.priority) || (b.suffix.length-a.suffix.length));

function analyzeWord(raw){
  const w = raw.trim().toLowerCase();
  for(const rule of SORTED_RULES){
    if(w.endsWith(rule.suffix) && w.length > rule.suffix.length){
      const stem = w.slice(0, w.length - rule.suffix.length);
      const gloss = KNOWN_STEMS[stem] || stem;
      return {word:raw, stem:gloss, suffix:rule.suffix, vibhakti:rule.vibhakti, karaka:rule.karaka, role:rule.role};
    }
  }
  return {word:raw, unrecognized:true};
}

function parseSentence(sentence){
  return sentence.trim().split(/\s+/).filter(Boolean).map(analyzeWord);
}

function summarizeSentence(sentence){
  const analyses = parseSentence(sentence);
  const roles = {};
  analyses.forEach(a=>{
    if(a.karaka){
      roles[a.karaka] = roles[a.karaka] || [];
      roles[a.karaka].push(a.word);
    }
  });
  return roles;
}

const input = document.getElementById('sentence-input');
const resultsEl = document.getElementById('results');
const samplesEl = document.getElementById('samples');

const SAMPLES = [
  "ramah phalam khadati",
  "ramena vrikshah chidyate",
  "gurave shishyah namati",
  "gramat ramah agachhati",
  "ramasya pustakam",
  "grame vrikshah asti",
];

SAMPLES.forEach(s=>{
  const chip = document.createElement('button');
  chip.className = 'chip';
  chip.textContent = s;
  chip.addEventListener('click', ()=>{ input.value = s; render(); });
  samplesEl.appendChild(chip);
});

function render(){
  const sentence = input.value;
  const analyses = parseSentence(sentence);

  resultsEl.innerHTML = '';
  analyses.forEach(a=>{
    const card = document.createElement('div');
    if(a.unrecognized){
      card.className = 'word-card unrecognized';
      card.innerHTML = `
        <span class="word">${a.word}</span>
        <span class="stem-suffix">no matching rule — likely a verb or unmodeled form</span>
        <span class="role-pill role-none">unrecognized</span>
      `;
    } else {
      card.className = 'word-card';
      card.innerHTML = `
        <span class="word">${a.word}</span>
        <span class="stem-suffix">stem <b>${a.stem}</b> &middot; suffix <b>-${a.suffix}</b> &middot; ${a.vibhakti}</span>
        <span class="role-pill role-${a.role}">${a.karaka}</span>
      `;
    }
    resultsEl.appendChild(card);
  });

  const roles = summarizeSentence(sentence);
  const roleKeys = Object.keys(roles);
  const summary = document.createElement('div');
  summary.className = 'summary-line';
  if(roleKeys.length === 0){
    summary.textContent = 'No recognizable karaka roles found in this input.';
  } else {
    summary.innerHTML = roleKeys.map(k => `<span>${k}</span>: ${roles[k].join(', ')}`).join('  &nbsp;&middot;&nbsp;  ');
  }
  resultsEl.appendChild(summary);
}

input.addEventListener('input', render);
render();
</script>

</body>
</html>
